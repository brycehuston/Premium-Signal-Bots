name: Alpha Cinematic Stage QA

on:
  push:
    branches: [release/alpha-cinematic-stage-polish-20261111]
    paths:
      - "hub-frontend/**"
      - ".github/workflows/alpha-cinematic-stage-qa.yml"
  pull_request:
    paths:
      - "hub-frontend/**"
      - ".github/workflows/alpha-cinematic-stage-qa.yml"

permissions:
  contents: read
concurrency:
  group: cinematic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub-frontend/package-lock.json
      - name: Dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Local frontend
        run: |
          (npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/alpha-cinematic.log 2>&1 &)
          for n in $(seq 1 90); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/alpha-cinematic.log
          exit 1
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - name: Exercise stage flow at phone, tablet, desktop and landscape widths
        run: node qa/alpha-cinematic.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Preserve visual QA images and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-cinematic-qa
          path: hub-frontend/qa-cinematic-artifacts/
          if-no-files-found: warn
          retention-days: 7
