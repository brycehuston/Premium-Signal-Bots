name: Update Next.js security lockfile (preview only)
on:
  push:
    branches:
      - feature/alpha-lane-intelligence-dashboard-v4
    paths:
      - hub-frontend/package.json
permissions:
  contents: write
jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub-frontend/package-lock.json
      - name: Resolve production dependencies and update lockfile
        working-directory: hub-frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          npm ci --ignore-scripts --no-audit --fund=false
          npm ls next eslint-config-next --depth=0
      - name: Commit lockfile only to release candidate
        run: |
          git diff --exit-code -- hub-frontend/package.json
          git add hub-frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git -c user.name='alpha-security-bot' -c user.email='actions@users.noreply.github.com' commit -m 'Lock Next.js maintenance security patch'
          git push origin HEAD:feature/alpha-lane-intelligence-dashboard-v4
